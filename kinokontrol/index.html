<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14233d"><title>ЭлектроКиноТест 0.9</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ЭлектроКиноТест"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#17243a;--muted:#657187;--line:#dde3ec;--blue:#2467cf;--red:#b53434;--green:#15724c;--amber:#9a6714;--radius:15px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.48 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#14233d;color:white;padding:15px max(18px,calc((100vw - 1240px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center}header strong{font-size:19px}header small{color:#b7c7e4;display:block}.app{max-width:1240px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}.tabs button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;white-space:nowrap}.tabs button.active{background:#2467cf;color:white;border-color:#2467cf}.panel{background:var(--card);padding:20px;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 20px #1b34550a;margin-bottom:16px}h1,h2,h3,p{margin-top:0}h2{font-size:21px;margin-bottom:14px}h3{font-size:16px;margin:12px 0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{color:#4b5b72;font-size:13px;font-weight:600}.field input,.field select,.field textarea,textarea.long{border:1px solid #cbd5e1;padding:10px 11px;border-radius:9px;width:100%;background:white;color:#1b2b44;min-width:0}.field textarea{min-height:75px;resize:vertical}.field small{color:var(--muted)}.btn{border:0;border-radius:9px;background:#2467cf;color:#fff;padding:10px 15px;font-weight:650}.btn.secondary{background:#e9effa;color:#2454a0}.btn.light{background:#f1f4f8;color:#243a5c}.btn.danger{background:#fff0ee;color:#a12e2e}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted)}.notice{border-left:3px solid #4982dd;background:#eef4ff;padding:11px 13px;border-radius:6px;color:#28446f;margin:12px 0}.warning{border-left-color:#d99a34;background:#fff6e5;color:#80500c}.error{border-left-color:#d45151;background:#fff1f1;color:#872e2e}.ok{border-left-color:#3b9e7b;background:#eefaf5;color:#176447}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.listrow small{display:block;color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;border-radius:20px;background:#edf1f7;color:#456079;padding:4px 9px}.chip.high{background:#ffe5df;color:#a03128}.chip.mid{background:#fff0d7;color:#895a05}.chip.good{background:#e4f7ec;color:#127045}.split{display:grid;grid-template-columns:260px 1fr;gap:15px}.sidebar .btn{width:100%;text-align:left;margin-bottom:7px}.sidebar .btn.current{background:#172b4b;color:#fff}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}th{font-size:13px;color:#586a80;background:#f5f7fb}td input,td select{width:100%;min-width:90px;border-radius:7px;border:1px solid #cad4e0;padding:8px}td.status{min-width:165px}.thumb{width:112px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.photo{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0;align-items:flex-start}.photo>div{flex:1}.hint{font-size:13px;color:var(--muted)}.empty{padding:22px;border:1px dashed #bcc7d8;border-radius:12px;color:var(--muted);text-align:center}.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stat{border:1px solid var(--line);padding:13px;border-radius:10px;background:#fafcff}.stat strong{font-size:22px;display:block}.toast{position:fixed;bottom:18px;right:18px;z-index:20;background:#1b344f;color:white;padding:12px 16px;border-radius:10px;max-width:80%;box-shadow:0 4px 24px #0003;display:none}.check-grid{grid-template-columns:2.7fr 1fr 2fr;display:grid;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #e5eaf0}.check-grid.head{font-weight:650;color:#586a80;background:#f5f7fb}.smallbtn{border:0;background:#ecf1f8;color:#2b5689;padding:7px 10px;border-radius:7px;font-size:13px}.spacer{height:12px}.badge{display:inline-block;background:#eaf3ff;color:#315f9f;border-radius:7px;padding:3px 7px;font-size:12px}.report-preview{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:16px;line-height:1.65}.bottom{color:#67788d;text-align:center;font-size:12px;padding:12px}.onlydesktop{display:inline}@media(max-width:760px){.app{padding:10px}.panel{padding:14px}.grid,.grid3,.split{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr;gap:5px}.check-grid.head{display:none}.check-grid>span:first-child{font-weight:600}.tabs button{padding:9px 11px}.onlydesktop{display:none}header{padding:12px}}
.photo-categories-v08{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.photo-category-v08{border:1px solid #d3dce9;border-radius:11px;background:#f7f9fc;color:#1b2b44;text-align:left;padding:12px;min-height:76px}.photo-category-v08 strong{display:block;font-size:14px}.photo-category-v08 small{display:block;color:#66768b;font-size:12px;margin-top:5px}.photo-category-v08.chosen{border:2px solid #2467cf;background:#eaf3ff;padding:11px}@media(max-width:500px){.photo-categories-v08{gap:7px}.photo-category-v08{padding:10px}} .photo-category-v08.wide{grid-column:1/-1;min-height:56px}.photo-category-v08.neutral{border-color:#cbd5e1;background:#f1f4f8}.photo-category-v08.neutral.chosen,.photo-category-v08.wide.chosen{border-color:#2467cf}.photo-category-v08.filled{background:#e4f7e9;border-color:#36965a}.photo-category-v08.missing{background:#fff0ef;border-color:#cb6d69}.photo-category-v08.chosen{box-shadow:inset 0 0 0 1px currentColor}.photo-category-v08.filled.chosen{color:#17633a;border-color:#27884c}.photo-category-v08.missing.chosen{color:#922f2f;border-color:#b94545}.photo-thumb{border:0;padding:0;background:none}.photo-dialog{width:min(95vw,760px);max-height:92dvh;border:0;border-radius:14px;padding:14px;color:var(--text);overflow:auto}.photo-dialog::backdrop{background:#101a2abb}.photo-dialog video{display:block;width:100%;max-height:49dvh;background:#14233d}.photo-dialog p{margin:8px 0}.capture-strip{display:flex;gap:5px;overflow:auto}.capture-strip img{height:48px;border-radius:4px}.markup-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.markup-tools [aria-pressed=true]{outline:2px solid #2467cf}.markup-text:not([hidden]){display:block;margin:7px 0}.markup-stage{display:flex;justify-content:center;margin-top:9px}.markup-stage canvas{max-width:100%;max-height:53dvh;object-fit:contain;touch-action:none;display:block;width:auto;height:auto} </style></head><body><header><div><strong>ЭлектроКиноТест</strong> <span class="badge">v0.9</span><small>Обследование электрооборудования кинотеатров · локальная версия</small></div><span id="saveState" style="font-size:12px;color:#bed3f2">Загрузка…</span></header><main class="app"><nav class="tabs" id="tabs"></nav><div id="root"></div><div class="bottom">Данные хранятся в этом браузере. Для резервной копии регулярно экспортируйте проект через вкладку «Передача».</div></main><div class="toast" id="toast"></div><script>
'use strict';
const ID=()=>('id-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)));
const CHECKS=[
 ['Общие сведения','Проверено соответствие маркировки щита и обслуживаемых линий'],
 ['Визуальный осмотр','Осмотрены корпус, двери, запирающие устройства и вводы кабелей'],
 ['Визуальный осмотр','Проверено наличие крышек, заглушек и защиты от случайного прикосновения'],
 ['Визуальный осмотр','Проверено отсутствие видимых повреждений, следов нагрева, обугливания и загрязнения'],
 ['Визуальный осмотр','Осмотрены видимые участки изоляции, вводы и крепления кабелей без вскрытия и вмешательства'],
 ['Визуальный осмотр','Проверена видимая маркировка автоматов и отходящих линий'],
 ['Визуальный осмотр','Проведён доступный внешний осмотр N и PE без вмешательства под напряжением'],
 ['Защитная аппаратура','Зафиксированы номиналы, типы и видимое состояние автоматов/УЗО'],
 ['Дополнительные работы','Проведён тепловизионный осмотр при рабочей нагрузке'],
 ['Дополнительные работы','Измерены токи клещами на доступных проводниках']
];
const OLD_CHECK_INDEXES=[0,2,3,4,5,6,7,8,10,11];
function newPanel(name='Распределительный щит'){return {id:ID(),kind:'shield',name,location:'',inputBreaker:'',breakerType:'',notes:'',inspection:'notdone',check:{},measures:{l1:'',l2:'',l3:'',n:'',pe:'',mode:'',phaseMin:'9',phaseMax:'14'},thermal:{status:'notdone',ambient:'',maxTemp:'',load:'',comment:''}}}
function newHall(n){return {id:ID(),name:'Зал № '+n,status:'notdone',notes:'',panels:[newPanel('Зал № '+n)]}}
function boardEntries(){return project.halls.flatMap(h=>h.panels.map(p=>({h,p})))}
function boardName(h,p){return p.name||h.name||'Без названия'}
function boardOptions(){return boardEntries().map(({h,p})=>[h.id+'|'+p.id,boardName(h,p)])}
function newProject(){return {version:8,id:ID(),name:'Новое обследование',city:'',address:'',date:new Date().toISOString().slice(0,10),inspector:'',inspector2:'',inspector3:'',representative:'',scope:'Внешний визуальный осмотр, тепловизионное обследование и измерение токов клещами без отключения оборудования',limitations:'',phaseMin:'9',phaseMax:'14',halls:[],findings:[],photos:[],conclusionEdit:'',conclusionCustom:false}}
let project=newProject(),tab='main',hallId=null,panelId=null,selectedPhotoHall='',pendingSave=null,db=null;
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);const findHall=id=>project.halls.find(x=>x.id===id),findPanel=(h,p)=>findHall(h)?.panels.find(x=>x.id===p);
function notify(s){let t=el('toast');t.textContent=s;t.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display='none',4000)}
function dbOpen(){return new Promise((resolve,reject)=>{let req=indexedDB.open('kinokontrol-v06',1);req.onupgradeneeded=()=>req.result.createObjectStore('store');req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result)})}
function storeGet(key){return new Promise((resolve,reject)=>{let q=db.transaction('store').objectStore('store').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function storeSet(key,val){return new Promise((resolve,reject)=>{let tx=db.transaction('store','readwrite');tx.oncomplete=()=>resolve();tx.onabort=tx.onerror=()=>reject(tx.error||new Error('Транзакция не завершена'));tx.objectStore('store').put(val,key)})}
async function persist(){try{await storeSet('project',project);el('saveState').textContent='Сохранено локально';return true}catch(e){el('saveState').textContent='Ошибка сохранения';notify('Не удалось сохранить: '+e.message);return false}}
function scheduleSave(){el('saveState').textContent='Сохранение…';clearTimeout(pendingSave);pendingSave=setTimeout(persist,400)}
function field(label,path,val,type='text',extra=''){return `<div class="field"><label>${html(label)}</label>${type==='textarea'?`<textarea data-path="${html(path)}" ${extra}>${html(val)}</textarea>`:`<input data-path="${html(path)}" type="${type}" value="${html(val)}" ${extra}>`}</div>`}
function selectField(label,path,value,opts){return `<div class="field"><label>${html(label)}</label><select data-path="${html(path)}">${opts.map(([v,l])=>`<option value="${html(v)}" ${String(value)===String(v)?'selected':''}>${html(l)}</option>`).join('')}</select></div>`}
const inspectionOpts=[['notdone','Не обследован'],['ok','Обследован без замечаний'],['issues','Выявлены замечания']];const checkOpts=[['','Не отмечено'],['done','Выполнено'],['no','Не выполнено'],['na','Не применимо']];const thermOpts=[['notdone','Не проводилось'],['done','Проводилось'],['partial','Частично']];
function topTabs(){let tabs=[['main','Обследование'],['halls','Электрощиты'],['checks','Чек-листы и измерения'],['findings','Замечания'],['photos','Фотографии'],['reports','Отчёты'],['transfer','Передача']];el('tabs').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')}
function render(){topTabs();let r=el('root');r.innerHTML=({main:renderMain,halls:renderHalls,checks:renderChecks,findings:renderFindings,photos:renderPhotos,reports:renderReports,transfer:renderTransfer}[tab])();}
function renderMain(){return `<section class="panel"><h2>Данные обследования</h2><div class="grid">${field('Кинотеатр / объект','name',project.name)}${field('Город','city',project.city)}${field('Адрес','address',project.address)}${field('Дата обследования','date',project.date,'date')}${field('Обследующий 1','inspector',project.inspector)}${field('Обследующий 2','inspector2',project.inspector2)}${field('Обследующий 3','inspector3',project.inspector3)}${field('Представитель кинотеатра','representative',project.representative)}</div><div class="spacer"></div>${field('Объём выполненных работ','scope',project.scope,'textarea')}${field('Ограничения обследования / что не проверялось','limitations',project.limitations,'textarea')}<h3>Рабочий диапазон токов фаз для ориентировочной оценки</h3><div class="grid">${field('От, А','phaseMin',project.phaseMin,'number','step="0.1" min="0"')}${field('До, А','phaseMax',project.phaseMax,'number','step="0.1" min="0"')}</div><div class="notice warning">Диапазон 9–14 А — внутренний рабочий ориентир, не норматив безопасности. Диапазон не заменяет проверку соответствия линии и защитного аппарата. Нулевой и защитный проводники оцениваются отдельно.</div></section><section class="panel"><h2>Сводка</h2><div class="grid3"><div class="stat"><strong>${boardEntries().length}</strong>щитов и объектов в проекте</div><div class="stat"><strong>${boardEntries().filter(x=>x.p.inspection!=='notdone').length}</strong>обследовано</div><div class="stat"><strong>${project.findings.length}</strong>замечаний</div></div><div class="actions"><button class="btn" data-tab="checks">Заполнить обследование</button><button class="btn secondary" data-tab="reports">Смотреть отчёты</button></div></section>`}
function hallSelect(value,attr='data-action="select-hall"'){return `<select ${attr}>${project.halls.map(h=>`<option value="${html(h.id)}" ${h.id===value?'selected':''}>${html(h.name)}</option>`).join('')}</select>`}
function renderHalls(){let entries=boardEntries();return `<section class="panel"><h2>Электрощиты и оборудование объекта</h2><p>Добавляйте щиты независимо от залов: «Зал № 1», «ВРУ», «Бар», «Кассы», «Комната администрации» и любые другие. Названия свободные. Кнопка «Добавить объект» подходит для ЭКОС, Laurent, щитов освещения и другого оборудования.</p><div class="actions"><button class="btn" data-action="add-board">+ Добавить щит</button><button class="btn secondary" data-action="add-object">+ Добавить объект</button></div>${entries.length?entries.map(({h,p})=>`<div class="listrow"><div style="flex:1"><div class="grid">${field(p.kind==='object'?'Название объекта':'Название щита',`panel.${h.id}.${p.id}.name`,p.name)}${selectField('Статус обследования',`panel.${h.id}.${p.id}.inspection`,p.inspection,inspectionOpts)}</div><div class="actions"><button class="smallbtn" data-action="open-board" data-hall="${h.id}" data-id="${p.id}">Открыть обследование</button><button class="btn danger" data-action="delete-board" data-hall="${h.id}" data-id="${p.id}">Удалить</button></div></div></div>`).join(''):'<div class="empty">Пока нет записей. Нажмите «Добавить щит» или «Добавить объект».</div>'}</section>`}

function chooseCurrent(){let entries=boardEntries();let found=entries.find(x=>x.h.id===hallId&&x.p.id===panelId)||entries[0];hallId=found?.h.id||null;panelId=found?.p.id||null;return [found?.h||null,found?.p||null]}
function renderChecks(){let [h,p]=chooseCurrent();let entries=boardEntries();if(!p)return '<section class="panel"><h2>Обследование щитов</h2><div class="empty">Добавьте щит во вкладке «Электрощиты».</div><button class="btn" data-action="add-board">+ Добавить щит</button><button class="btn secondary" data-action="add-object">+ Добавить объект</button></section>';return `<div class="split"><section class="panel sidebar"><h3>Выбор электрощита</h3>${entries.map(z=>`<button class="btn ${z.p.id===panelId?'current':'secondary'}" data-action="open-board" data-hall="${z.h.id}" data-id="${z.p.id}">${html(boardName(z.h,z.p))}</button>`).join('')}<button class="btn light" data-action="add-board">+ Добавить щит</button><button class="btn light" data-action="add-object">+ Добавить объект</button></section><div><section class="panel"><div class="inline" style="justify-content:space-between"><h2>${html(boardName(h,p))}</h2><button class="btn danger" data-action="delete-board" data-hall="${h.id}" data-id="${p.id}">Удалить</button></div><div class="grid">${field(p.kind==='object'?'Название объекта':'Название электрощита',`panel.${h.id}.${p.id}.name`,p.name)}${field('Расположение',`panel.${h.id}.${p.id}.location`,p.location)}${selectField('Результат обследования',`panel.${h.id}.${p.id}.inspection`,p.inspection,inspectionOpts)}${field('Вводной автомат, А',`panel.${h.id}.${p.id}.inputBreaker`,p.inputBreaker,'number','min="0" step="0.1"')}${field('Тип / характеристика аппарата',`panel.${h.id}.${p.id}.breakerType`,p.breakerType)}</div><div class="spacer"></div>${field('Общие примечания',`panel.${h.id}.${p.id}.notes`,p.notes,'textarea')}</section><section class="panel"><h3>Фотофиксация щита</h3><div class="actions"><button class="btn" data-action="photo-for-board" data-hall="${h.id}" data-id="${p.id}">📷 Сделать фото / прикрепить</button></div><p class="hint">Снимок с камеры сразу прикрепится к выбранному щиту.</p></section>${renderChecklist(h,p)+renderMeasures(h,p)+renderThermal(h,p)}</div></div>`}

function renderChecklist(h,p){return `<section class="panel"><h2>1. Визуальный осмотр и сбор технических данных</h2><p>Для каждого пункта укажите фактический статус. «Не выполнено» не означает «дефект выявлен».</p><div class="check-grid head"><span>Выполненная работа</span><span>Статус</span><span>Примечание</span></div>${CHECKS.map(([group,name],i)=>{let v=p.check[i]||{status:'',note:''};return `<div class="check-grid"><span><small class="muted">${html(group)} · ${i+1}</small><div>${html(name)}</div></span><select data-path="check.${h.id}.${p.id}.${i}.status">${checkOpts.map(([code,label])=>`<option value="${code}" ${v.status===code?'selected':''}>${label}</option>`).join('')}</select><input data-path="check.${h.id}.${p.id}.${i}.note" placeholder="Комментарий (необязательно)" value="${html(v.note)}"></div>`}).join('')}<div class="actions"><button class="btn secondary" data-action="bulk-check" data-value="done" data-hall="${h.id}" data-id="${p.id}">Выполнено всё</button><button class="btn light" data-action="bulk-check" data-value="no" data-hall="${h.id}" data-id="${p.id}">Не выполнено всё</button></div><p class="hint">Статусы всех пунктов изменятся; комментарии сохранятся. Любой пункт затем можно скорректировать вручную.</p></section>`}
function renderMeasures(h,p){const path=`measure.${h.id}.${p.id}.`;let m=p.measures;let result=evaluate(p,project);return `<section class="panel"><h2>2. Измерение токов токовыми клещами</h2><div class="grid3">${[['l1','L1 — фаза A, А'],['l2','L2 — фаза B, А'],['l3','L3 — фаза C, А'],['n','N — нейтраль, А'],['pe','PE — защитный, А']].map(([k,l])=>field(l,path+k,m[k],'number','step="any" min="0" placeholder="Не измерено"')).join('')}</div><div class="spacer"></div><div class="grid">${selectField('Режим нагрузки',path+'mode',m.mode,[['','Не выбран'],['full','Полная'],['partial','Частичная'],['none','Отсутствует']])}</div><div class="notice">Подсказки пересчитываются после изменения поля. Незаполненное поле означает «не измерено», а не 0 А.</div><div class="grid3">${result.rows.map(r=>`<div class="stat"><b>${html(r.label)}</b><br><span class="chip ${r.tone}">${html(r.message)}</span></div>`).join('')}</div>${result.alerts.map(t=>`<div class="notice ${t.tone==='high'?'error':t.tone==='mid'?'warning':''}">${html(t.text)}</div>`).join('')}</section>`}
function renderThermal(h,p){let t=p.thermal;let path=`thermal.${h.id}.${p.id}.`;return `<section class="panel"><h2>3. Тепловизионное обследование при рабочей нагрузке</h2><div class="grid">${selectField('Проводилось ли',path+'status',t.status,thermOpts)}${field('Температура окружающей среды, °C',path+'ambient',t.ambient,'number','step="any"')}${field('Максимальная зафиксированная температура, °C',path+'maxTemp',t.maxTemp,'number','step="any"')}</div><div class="spacer"></div>${field('Описание тепловизионного обследования',path+'comment',t.comment,'textarea')}<div class="notice">Термограммы JPG/PNG прикрепляются в разделе «Фотографии» с привязкой к этому щиту. Без данных об условиях съёмки температура сама по себе не доказывает аварийный дефект.</div></section>`}
function severityOptions(value){return [['p3','Низкий'],['p2','Средний'],['p1','Высокий']].map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('')}
function renderFindings(){let opts=boardOptions();return `<section class="panel"><h2>Замечания и план устранения</h2><div class="actions"><button class="btn" data-action="add-finding" ${opts.length?'':'disabled'}>+ Добавить замечание</button></div>${!project.findings.length?'<div class="empty">Замечаний пока нет. Добавьте выявленные дефекты или отметьте щит как обследованный без замечаний.</div>':''}${project.findings.map((f,i)=>`<div class="panel" style="margin-top:12px;background:#fcfdff"><div class="inline" style="justify-content:space-between"><h3>Замечание № ${i+1}</h3><button class="btn danger" data-action="delete-finding" data-id="${f.id}">Удалить</button></div><div class="grid">${selectField('Электрощит',`findingBoard.${f.id}`,f.hallId+'|'+f.panelId,opts)}<div class="field"><label>Приоритет</label><select data-path="finding.${f.id}.priority">${severityOptions(f.priority)}</select></div></div><div class="spacer"></div>${field('Обнаруженный дефект / факт',`finding.${f.id}.description`,f.description,'textarea')}${field('Рекомендация',`finding.${f.id}.recommendation`,f.recommendation,'textarea')}${field('Обоснование приоритета',`finding.${f.id}.reason`,f.reason,'textarea')}</div>`).join('')}<div class="actions"><button class="btn" data-action="add-finding" ${opts.length?'':'disabled'}>+ Добавить замечание</button></div></section>`}
function renderPhotos(){let entries=boardEntries();let selected=entries.find(({h,p})=>h.id+'|'+p.id===selectedPhotoHall)||entries[0];if(selected)selectedPhotoHall=selected.h.id+'|'+selected.p.id;let imgs=project.photos;return `<section class="panel"><h2>Фотографии и термограммы</h2><p>Все фотографии и термограммы привязываются напрямую к выбранному электрощиту.</p>${!selected?'<div class="empty">Сначала добавьте щит.</div>':`<div class="grid">${selectField('Электрощит','photoPicker.board',selectedPhotoHall,boardOptions())}<div class="field"><label>Тип снимков</label><select id="photoType"><option value="regular">Обычная фотография</option><option value="thermal">Термограмма</option></select></div><div class="field"><label>Выбрать снимки из галереи / файлы</label><input id="imageUpload" type="file" accept="image/jpeg,image/png,image/webp" multiple></div><div class="field"><label>Сделать фото камерой iPhone</label><input id="cameraUpload" type="file" accept="image/*" capture="environment"></div></div><div class="actions"><span class="hint">После выбора или съёмки фото добавляется автоматически.</span></div>`}<h3>Прикреплено: ${imgs.length}</h3>${imgs.length?imgs.map(x=>{let ih=findHall(x.hallId),ip=ih?.panels.find(p=>p.id===x.panelId);return `<div class="photo"><img class="thumb" src="${x.data}" alt="Снимок"><div><b>${html(ip?boardName(ih,ip):'Щит удалён')}</b><div class="muted">${x.type==='thermal'?'Термограмма':'Обычная фотография'} · ${html(x.name||'')}</div><div class="field"><label>Комментарий / описание снимка</label><input data-path="photo.${x.id}.comment" value="${html(x.comment)}" placeholder="Где и что изображено"></div><div class="field"><label>Связь с замечанием</label><select data-path="photo.${x.id}.findingId"><option value="">Без замечания</option>${project.findings.filter(f=>f.hallId===x.hallId&&f.panelId===x.panelId).map(f=>`<option value="${f.id}" ${x.findingId===f.id?'selected':''}>${html(f.description||'Замечание')}</option>`).join('')}</select></div><button class="smallbtn" data-action="delete-photo" data-id="${x.id}">Удалить снимок</button></div></div>`}).join(''):'<div class="empty">Пока нет фотографий.</div>'}</section>`}

function countStats(){let panels=project.halls.flatMap(h=>h.panels);return {halls:project.halls.length,panels:panels.length,checked:panels.filter(p=>p.inspection!=='notdone').length,withIssues:panels.filter(p=>p.inspection==='issues').length,notChecked:panels.filter(p=>p.inspection==='notdone').length,photos:project.photos.length,thermal:project.photos.filter(x=>x.type==='thermal').length}}
function findingsByPriority(pr){return project.findings.filter(f=>f.priority===pr)}
function inspectors(){return [project.inspector,project.inspector2,project.inspector3].filter(x=>String(x||'').trim()).map(x=>String(x).trim())}
function signatures(){let people=inspectors();return people.map((p,i)=>`Обследующий ${people.length>1?i+1:''}: ____________________ / ${html(p)}`).join('<br><br>')+'<br><br>Представитель объекта: ____________________ / '+html(project.representative)}
function generatedConclusion(){
const s=countStats(), first=project.findings.length, urgent=findingsByPriority('p1').length, soon=findingsByPriority('p2').length, later=findingsByPriority('p3').length;
let lines=[`На объекте «${project.name||'Кинотеатр'}» фактически обследовано ${s.checked} из ${s.panels} внесённых электрощитов. ${first?`По результатам обследования зарегистрировано ${first} замечаний: высокий приоритет — ${urgent}, средний — ${soon}, низкий — ${later}.`:s.checked? 'По внесённым результатам осмотра замечания не зарегистрированы.':'Результаты обследования щитов пока не внесены.'}`];
if(s.notChecked)lines.push('Оценка технического состояния распространяется только на фактически обследованное оборудование; остальные щиты в выводы не включены.');
if(first){for(const [pr,label] of [['p1','В первоочередном порядке'],['p2','В порядке плановых корректирующих мероприятий'],['p3','В рамках последующего обслуживания']]){let items=findingsByPriority(pr);if(items.length)lines.push(`${label} рекомендуется: ${items.map(f=>{let h=findHall(f.hallId),p=h?.panels.find(x=>x.id===f.panelId);return `${p?boardName(h,p):'щит не указан'}: ${f.description||'замечание не описано'}${f.recommendation?'; '+f.recommendation:''}`}).join('. ')}.`)}}
if(project.limitations)lines.push(`Условия и ограничения обследования: ${project.limitations}`);
lines.push('Выводы основаны только на фактически выполненном внешнем осмотре и внесённых измерениях без отключения и разборки электрооборудования. Электрические испытания и проверка скрытых элементов в объём заключения не входят.');
return lines.join('\n\n')}
function renderReports(){let auto=generatedConclusion();return `<section class="panel"><h2>Два итоговых PDF</h2><p>Нажмите кнопку: отчёт откроется в отдельном окне, затем выберите «Печать → Сохранить в PDF». Каждый документ формируется отдельно, с текущим списком щитов.</p><div class="grid"><div class="stat"><b>1. Полный технический отчёт</b><p>Общий акт, результаты по каждому щиту, чек-листы, измерения, термограммы, фотографии и ведомость дефектов.</p><button class="btn" data-action="report-full">Открыть полный отчёт</button></div><div class="stat"><b>2. Итоговое заключение</b><p>Описание фактической ситуации, замечания и рекомендации по трём приоритетам, ограничения обследования.</p><button class="btn" data-action="report-summary">Открыть заключение</button></div></div><div class="spacer"></div><h3>Текст заключения — можно отредактировать</h3><div class="inline"><button class="smallbtn" data-action="generate-conclusion">Обновить по данным обследования</button><span class="hint">Автоматическое обновление заменит ручные правки</span></div><div class="spacer"></div><textarea class="long" rows="17" data-path="conclusionEdit" id="conclusionText">${html(project.conclusionCustom?project.conclusionEdit:auto)}</textarea><div class="notice warning">Автоматический текст — черновик для технической проверки обследующим. Перед передачей руководству проверьте формулировки, корректность приоритетов и соответствие фактическим замерам.</div></section>`}
function renderTransfer(){return `<section class="panel"><h2>Передача проекта iPhone ↔ компьютер</h2><p>На телефоне заполните обследование и обычные фотографии, выгрузите проект одним файлом JSON и отправьте его себе через Telegram как документ. На компьютере импортируйте этот файл, добавьте термограммы и сформируйте оба PDF.</p><div class="actions"><button class="btn" data-action="export-project">Скачать файл проекта</button><button class="btn secondary" data-action="share-project">Поделиться проектом</button></div><div class="spacer"></div><div class="field"><label>Импорт файла проекта JSON</label><input id="importFile" type="file" accept=".json,application/json"></div><div class="actions"><button class="btn secondary" data-action="import-project">Импортировать</button><button class="btn danger" data-action="new-project">Создать новое обследование</button></div><div class="notice warning">Импорт полностью заменяет открытое обследование. Перед импортом экспортируйте резервную копию. Фото включаются в проект и увеличивают размер файла.</div><div class="notice">Приложение работает без сервера и не отправляет данные автоматически. Для iPhone открытие отдельного HTML-файла из «Файлов» может ограничивать локальное хранение; полноценная установка PWA потребует HTTPS-размещения. На компьютере поддерживается Chrome/Edge.</div></section>`}
function num(x){if(x===''||x===null||x===undefined)return null;let n=Number(String(x).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
function evaluate(p,pr){let a=p.measures;let rows=[],alerts=[];let min=num(pr.phaseMin),max=num(pr.phaseMax);for(const [k,label] of [['l1','L1'],['l2','L2'],['l3','L3']]){let n=num(a[k]);let message=n===null?'Не измерено':(min!==null&&n<min)?'Ниже рабочего ориентира':(max!==null&&n>max)?'Выше рабочего ориентира':'В рабочем диапазоне';rows.push({label,message,tone:n===null?'':message==='В рабочем диапазоне'?'good':'mid'});}let ph=['l1','l2','l3'].map(k=>num(a[k]));if(ph.every(v=>v!==null)){let avg=ph.reduce((x,y)=>x+y,0)/3;let diff=avg?(Math.max(...ph)-Math.min(...ph))/avg*100:0;if(diff>20)alerts.push({tone:'mid',text:`Разброс фаз ${diff.toFixed(1)}% относительно среднего — проверить распределение нагрузки (внутренний порог, не норматив).`});else if(diff>10)alerts.push({tone:'mid',text:`Разброс фаз ${diff.toFixed(1)}% — обратить внимание (внутренний порог).`})}
let breaker=num(p.inputBreaker);for(const [k,label] of [['l1','L1'],['l2','L2'],['l3','L3']]){let n=num(a[k]);if(n!==null&&breaker!==null&&n>breaker)alerts.push({tone:'high',text:`${label}: измеренный ток ${n} А выше номинала вводного автомата ${breaker} А. Уточнить условия измерения и параметры защиты.`});}
let n=num(a.n),pe=num(a.pe);rows.push({label:'N',message:n===null?'Не измерено':`${n} А · оценка по схеме и гармоникам`,tone:''});rows.push({label:'PE',message:pe===null?'Не измерено':`${pe} А · проверить характер и точность измерения`,tone:pe!==null&&pe>0?'mid':''});if(pe!==null&&pe>0)alerts.push({tone:'mid',text:'Показание тока PE требует оценки схемы, характера нагрузки и чувствительности токовых клещей. Само по себе не доказывает дефект.'});return {rows,alerts}}
function setPath(path,value){let a=path.split('.');if(a[0]==='hall'){let h=findHall(a[1]);if(h)h[a[2]]=value;}else if(a[0]==='panel'){let p=findPanel(a[1],a[2]);if(p)p[a[3]]=value;}else if(a[0]==='check'){let p=findPanel(a[1],a[2]);if(p){p.check[a[3]] ||= {status:'',note:''};p.check[a[3]][a[4]]=value;}}else if(['measure','thermal','electric'].includes(a[0])){let p=findPanel(a[1],a[2]);if(p)p[{measure:'measures',thermal:'thermal',electric:'electrical'}[a[0]]][a[3]]=value;}else if(a[0]==='finding'){let f=project.findings.find(x=>x.id===a[1]);if(f){f[a[2]]=value;if(a[2]==='hallId'){f.panelId=findHall(value)?.panels[0]?.id||'';}}}else if(a[0]==='photo'){let p=project.photos.find(x=>x.id===a[1]);if(p)p[a[2]]=value}else if(a[0]==='findingBoard'){let f=project.findings.find(x=>x.id===a[1]);if(f){[f.hallId,f.panelId]=value.split('|');}}else if(a[0]==='photoPicker'){selectedPhotoHall=value;}else {project[path]=value;if(path==='conclusionEdit')project.conclusionCustom=true;}scheduleSave();}
function priorityWord(pr){return ({p1:'Высокий',p2:'Средний',p3:'Низкий'})[pr]||'Не указан'}

function photoReport(items){if(!items.length)return '<p>Снимков нет.</p>';return items.map((x,i)=>`<figure class="photo"><img src="${x.data}" alt="Фото"><figcaption>Фото ${i+1}. ${html(x.type==='thermal'?'Термограмма':'Обычная фотография')}. ${html(x.comment||x.name||'Без описания')}</figcaption></figure>`).join('')}
function fullReport(){let st=countStats();let body=`<h1>Акт обследования электрооборудования кинотеатра</h1><p>${html(project.name)} · ${html(project.city)} · ${html(project.address)}</p><table>${row('Дата',project.date)}${row('Обследующие',inspectors().join('; ')||'Не указаны')}${row('Представитель объекта',project.representative)}${row('Объём обследования',project.scope)}${row('Ограничения',project.limitations)}</table><p>Электрощитов: ${st.panels}; обследовано: ${st.checked}; замечаний: ${project.findings.length}; фотографий: ${st.photos}.</p><h2>Сводная ведомость замечаний</h2>${findingTable(project.findings)}`;
for(let h of project.halls){body+=`<section class="pagebreak"><h2>Обследование электрощитов</h2>`;for(let p of h.panels){body+=`<h3>${p.kind==='object'?'Объект':'Электрощит'}: ${html(boardName(h,p))}</h3><table>${row('Расположение',p.location)}${row('Статус',statusWord(p.inspection))}${row('Вводной автомат, А',p.inputBreaker)}${row('Тип защиты',p.breakerType)}${row('Примечания',p.notes)}</table><h3>Визуальный осмотр</h3><table><thead><tr><th>№</th><th>Работа</th><th>Результат</th><th>Примечание</th></tr></thead><tbody>${CHECKS.map(([g,n],i)=>{let v=p.check[i]||{};return `<tr><td>${i+1}</td><td>${html(n)}</td><td>${html(statusWord(v.status))}</td><td>${html(v.note||'')}</td></tr>`}).join('')}</tbody></table><h3>Токи токовых клещей, А</h3><table><tr><th>L1</th><th>L2</th><th>L3</th><th>N</th><th>PE</th></tr><tr>${['l1','l2','l3','n','pe'].map(k=>`<td>${html(p.measures[k]!==''?p.measures[k]:'Не измерено')}</td>`).join('')}</tr></table><p>Режим нагрузки: ${html(loadMode(p.measures.mode))}. Рабочий ориентир фаз: ${html(project.phaseMin)}–${html(project.phaseMax)} А (не норматив).</p><p>${html(evaluate(p,project).alerts.map(a=>a.text).join(' ')||'Дополнительных автоматических предупреждений не сформировано. Это не подтверждает соответствия электроустановки нормам.')}</p><h3>Тепловизионное обследование</h3><table>${row('Статус',statusWord(p.thermal.status))}${row('Температура окружающей среды, °C',p.thermal.ambient)}${row('Максимальная температура, °C',p.thermal.maxTemp)}${row('Комментарий',p.thermal.comment)}</table><h3>Замечания по щиту</h3>${findingTable(project.findings.filter(f=>f.hallId===h.id&&f.panelId===p.id))}<h3>Фотофиксация</h3>${photoReport(project.photos.filter(x=>x.hallId===h.id&&x.panelId===p.id))}`;}body+='</section>'}
body+=`<div class="signature">${signatures()}</div><p><small>Обследование проводится без отключения и вмешательства в электрооборудование. Документ отражает только внесённые результаты фактически выполненных работ и не заменяет протоколы специализированных испытаний.</small></p>`;return reportShell(body,'Полный технический отчёт')}function findingTable(arr){if(!arr.length)return '<p>Замечаний не зарегистрировано.</p>';return `<table><thead><tr><th>Электрощит</th><th>Приоритет</th><th>Факт</th><th>Рекомендация</th></tr></thead><tbody>${arr.map(f=>{let h=findHall(f.hallId),p=h?.panels.find(x=>x.id===f.panelId);return `<tr><td>${html(p?boardName(h,p):'Щит удалён')}</td><td>${html(priorityWord(f.priority))}</td><td>${html(f.description)}<br><small>${html(f.reason)}</small></td><td>${html(f.recommendation)}</td></tr>`}).join('')}</tbody></table>`}
function conclusionReport(){let s=countStats();let text=project.conclusionCustom?project.conclusionEdit:generatedConclusion();let body=`<h1>Итоговое техническое заключение</h1><p>Объект: ${html(project.name)} · ${html(project.city)} · ${html(project.address)}<br>Дата: ${html(project.date)}<br>Обследующие: ${html(inspectors().join('; ')||'Не указаны')}</p><h2>Сводные результаты</h2><table>${row('Щитов и объектов внесено',s.panels)}${row('Фактически обследовано',s.checked)}${row('Не обследовано',s.notChecked)}${row('Замечаний',project.findings.length)}</table><h2>Оценка ситуации и рекомендации</h2><p>${html(text)}</p><h2>План устранения по приоритетам</h2>`;for(let [pr,label] of [['p1','Высокий приоритет — в первую очередь'],['p2','Средний приоритет — во вторую очередь'],['p3','Низкий приоритет — плановые работы']])body+=`<h3>${label}</h3>${findingTable(findingsByPriority(pr))}`;body+=`<h2>Ограничения и область применения</h2><p>${html(project.limitations||'Ограничения отдельно не указаны. Необследованные элементы и невыполненные испытания не оцениваются.')}</p><div class="signature">${signatures()}</div>`;return reportShell(body,'Итоговое техническое заключение')}
function openReport(type){let win=window.open('','_blank');if(!win){notify('Разрешите открытие всплывающих окон для просмотра отчёта');return}win.document.open();win.document.write(type==='full'?fullReport():conclusionReport());win.document.close()}
async function encodePhoto(file){
  // Use iPhone image decoder; compress for reliable sharing of photo-rich JSON.
  let bmp=await createImageBitmap(file);let scale=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*scale));cv.height=Math.max(1,Math.round(bmp.height*scale));
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);bmp.close?.();return cv.toDataURL('image/jpeg',0.78);
}
async function addImages(inputId){let inp=el(inputId),files=Array.from(inp?.files||[]);if(!files.length)return;
let selected=boardEntries().find(({h,p})=>h.id+'|'+p.id===selectedPhotoHall);if(!selected){notify('Выберите щит');return}
let {h,p}=selected,type=inputId==='cameraUpload'?'regular':el('photoType').value,added=0;
for(let f of files){try{if(f.size>25*1024*1024){notify('Слишком большой снимок: '+f.name);continue}
let data=await encodePhoto(f);project.photos.push({id:ID(),hallId:h.id,panelId:p.id,type,data,name:f.name||'Фото с камеры',comment:'',findingId:''});added++;
}catch(err){notify('Не удалось обработать фото '+f.name+': '+err.message)}}
await persist();render();notify('Сохранено снимков: '+added)}

function projectFile(){let blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json'});let name=`ElektroKinoTest_${(project.city||project.name||'project').replace(/[^\p{L}\p{N}_-]/gu,'_')}_${project.date||'date'}.json`;return new File([blob],name,{type:'application/json'})}
function saveJsonFile(){let file=projectFile(),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);return file}
function normalize(input){if(!input||!Array.isArray(input.halls))throw new Error('Нет списка залов — неподдерживаемый формат проекта');if(input.halls.length>500)throw new Error('Слишком много залов');let old=Number(input.version||2)<3;let x={...newProject(),...input};x.version=8;x.halls=input.halls.map((h,i)=>({...newHall(i+1),...h,id:h.id||ID(),panels:Array.isArray(h.panels)?h.panels.map(p=>({...newPanel(),...p,id:p.id||ID(),check:old?Object.fromEntries(OLD_CHECK_INDEXES.map((k,j)=>[j,p.check?.[k]||{status:'',note:''}])):(p.check||{}),measures:{...newPanel().measures,...p.measures},thermal:{...newPanel().thermal,...p.thermal}})):[]}));x.findings=Array.isArray(input.findings)?input.findings.filter(f=>x.halls.some(h=>h.id===f.hallId&&h.panels.some(p=>p.id===f.panelId))):[];x.photos=Array.isArray(input.photos)?input.photos.filter(f=>x.halls.some(h=>h.id===f.hallId&&h.panels.some(p=>p.id===f.panelId))&&/^data:image\/(jpeg|png|webp);base64,/.test(f.data||'')):[];return x}
async function importProject(){let f=el('importFile')?.files?.[0];if(!f)return notify('Выберите файл проекта');if(!confirm('Импорт заменит текущее обследование. Вы сохранили его резервную копию?'))return;try{let text=await f.text(),parsed=JSON.parse(text);project=normalize(parsed);hallId=null;panelId=null;selectedPhotoHall='';await persist();tab='main';render();notify('Проект импортирован: '+boardEntries().length+' щитов')}catch(e){notify('Не удалось импортировать: '+e.message)}}
async function shareProject(){try{let file=projectFile();if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'ЭлектроКиноТест — проект обследования'});else {saveJsonFile();notify('Файл скачан. Отправьте его в Telegram как документ.')}}catch(e){if(e.name!=='AbortError')notify('Не удалось поделиться: '+e.message)}}
function ensureSelection(){let entries=boardEntries(),selected=entries.find(({h,p})=>h.id===hallId&&p.id===panelId)||entries[0];hallId=selected?.h.id||null;panelId=selected?.p.id||null;if(!entries.some(({h,p})=>h.id+'|'+p.id===selectedPhotoHall))selectedPhotoHall=entries[0]?entries[0].h.id+'|'+entries[0].p.id:''}

async function action(a,node){let id=node.dataset.id;switch(a){case 'bulk-check':{let p=findPanel(node.dataset.hall,id);if(!p)return;for(let i=0;i<CHECKS.length;i++){p.check[i] ||= {status:'',note:''};p.check[i].status=node.dataset.value==='done'?'done':'no';}break}case 'add-object':{let h={id:ID(),name:'',status:'notdone',notes:'',standalone:true,panels:[{...newPanel('Новый объект'),kind:'object'}]};project.halls.push(h);hallId=h.id;panelId=h.panels[0].id;tab='checks';break}case 'add-board':{let h={id:ID(),name:'',status:'notdone',notes:'',standalone:true,panels:[newPanel('Новый щит')]};project.halls.push(h);hallId=h.id;panelId=h.panels[0].id;tab='checks';break}case 'open-board':hallId=node.dataset.hall;panelId=id;tab='checks';break;case 'delete-board':{let h=findHall(node.dataset.hall),p=h?.panels.find(x=>x.id===id);if(!p||!confirm(`Удалить щит «${p.name}» вместе с замечаниями и фотографиями?`))return;h.panels=h.panels.filter(x=>x.id!==id);if(!h.panels.length)project.halls=project.halls.filter(x=>x.id!==h.id);project.findings=project.findings.filter(x=>x.panelId!==id);project.photos=project.photos.filter(x=>x.panelId!==id);if(panelId===id)panelId=null;break}case 'delete-hall':{let h=findHall(id);if(!confirm(`Удалить «${h?.name}» вместе со всеми щитами, замечаниями и фотографиями?`))return;project.halls=project.halls.filter(x=>x.id!==id);project.findings=project.findings.filter(x=>x.hallId!==id);project.photos=project.photos.filter(x=>x.hallId!==id);break}case 'add-panel':{let h=findHall(node.dataset.hall);if(h){let p=newPanel('Распределительный щит № '+(h.panels.length+1));h.panels.push(p);hallId=h.id;panelId=p.id;tab='checks'}break}case 'open-panel':hallId=node.dataset.hall;panelId=null;tab='checks';break;case 'pick-hall':hallId=id;panelId=null;break;case 'pick-panel':panelId=id;break;case 'delete-panel':{let h=findHall(hallId);if(!confirm('Удалить щит и связанные с ним замечания и фотографии?'))return;h.panels=h.panels.filter(x=>x.id!==id);project.findings=project.findings.filter(x=>x.panelId!==id);project.photos=project.photos.filter(x=>x.panelId!==id);panelId=null;break}case 'add-finding':{let selected=boardEntries()[0];if(!selected)return notify('Сначала добавьте электрощит');let {h,p}=selected;project.findings.push({id:ID(),hallId:h.id,panelId:p.id,priority:'p2',description:'',recommendation:'',due:'',reason:'',owner:''});break}case 'delete-finding':if(!confirm('Удалить замечание?'))return;project.findings=project.findings.filter(f=>f.id!==id);project.photos.forEach(p=>{if(p.findingId===id)p.findingId='' });break;case 'photo-for-board':selectedPhotoHall=node.dataset.hall+'|'+id;tab='photos';break;case 'add-images':return addImages('imageUpload');case 'delete-photo':if(!confirm('Удалить фотографию?'))return;project.photos=project.photos.filter(x=>x.id!==id);break;case 'report-full':return openReport('full');case 'report-summary':return openReport('summary');case 'generate-conclusion':if(project.conclusionCustom&&!confirm('Заменить ручной текст автоматически сформированным?'))return;project.conclusionCustom=false;project.conclusionEdit='';break;case 'export-project':return saveJsonFile();case 'share-project':return shareProject();case 'import-project':return importProject();case 'new-project':if(!confirm('Создать новое обследование? Сохраните старое через экспорт, иначе его данные будут заменены.'))return;project=newProject();hallId=null;panelId=null;selectedPhotoHall='';tab='main';break;}ensureSelection();scheduleSave();render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b)});
document.addEventListener('input',e=>{let p=e.target.dataset.path;if(!p)return;setPath(p,e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='cameraUpload'||e.target.id==='imageUpload'){addImages(e.target.id);return}let p=e.target.dataset.path;if(!p)return;setPath(p,e.target.value);if(p==='photoPicker.board'||p.startsWith('findingBoard.')||p.endsWith('.hallId')||p.endsWith('.name')||p.endsWith('.status')||p.startsWith('measure.')||p.startsWith('panel.')||p==='phaseMin'||p==='phaseMax')render()});
(async()=>{try{db=await dbOpen();let saved=await storeGet('project');if(!saved){try{let legacy=await new Promise(resolve=>{let req=indexedDB.open('kinokontrol-v05');req.onsuccess=()=>{let d=req.result;if(!d.objectStoreNames.contains('store')){d.close();return resolve(null)}let q=d.transaction('store').objectStore('store').get('project');q.onsuccess=()=>{d.close();resolve(q.result||null)};q.onerror=()=>{d.close();resolve(null)}};req.onerror=()=>resolve(null)});if(legacy){saved=legacy;el('saveState').textContent='Импортированы данные v0.5';}}catch(e){} if(!saved){try{let d=await new Promise(resolve=>{let req=indexedDB.open('kinokontrol-v04');req.onsuccess=()=>{let db=req.result;if(!db.objectStoreNames.contains('store')){db.close();return resolve(null)}let q=db.transaction('store').objectStore('store').get('project');q.onsuccess=()=>{db.close();resolve(q.result||null)};q.onerror=()=>{db.close();resolve(null)}};req.onerror=()=>resolve(null)});if(d)saved=d;}catch(e){}}}if(saved){project=normalize(saved);await persist()}el('saveState').textContent='Данные загружены'}catch(e){el('saveState').textContent='Локальное сохранение недоступно';notify('Не удалось открыть локальное хранилище. Регулярно экспортируйте проект.')}ensureSelection();render()})();
